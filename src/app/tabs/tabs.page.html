
<ion-tabs>

  @if (role === 'VENDOR') {
    <ion-tab-bar
      slot="bottom"
      class="bottom-navigation vendor-navigation"
    >
      @for (tab of vendorTabs; track tab.route) {
        <ion-tab-button
          [tab]="tab.route"
          [routerLink]="['/tabs', tab.route]"
          routerLinkActive="tab-selected"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          <ion-icon [name]="tab.icon"></ion-icon>
          <ion-label>{{ tab.label }}</ion-label>
        </ion-tab-button>
      }
    </ion-tab-bar>
  }

  @if (role === 'ADMIN') {
    <ion-tab-bar
      slot="bottom"
      class="bottom-navigation admin-navigation"
    >
      @for (tab of adminTabs; track tab.route) {
        <ion-tab-button
          [tab]="tab.route"
          [routerLink]="['/tabs', tab.route]"
          routerLinkActive="tab-selected"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          <ion-icon [name]="tab.icon"></ion-icon>
          <ion-label>{{ tab.label }}</ion-label>
        </ion-tab-button>
      }
    </ion-tab-bar>
  }

</ion-tabs>
