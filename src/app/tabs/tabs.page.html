<ion-tabs>




  <!-- ================================= -->
  <!-- VENDOR NAVIGATION -->
  <!-- ================================= -->

  @if (role === 'VENDOR') {

    <ion-tab-bar
      slot="bottom"
      class="bottom-navigation vendor-navigation">

      @for (tab of vendorTabs; track tab.route) {

        <ion-tab-button
          [tab]="tab.route">

          <ion-icon
            [name]="tab.icon">
          </ion-icon>

          <ion-label>
            {{ tab.label }}
          </ion-label>

        </ion-tab-button>

      }

    </ion-tab-bar>

  }


  <!-- ================================= -->
  <!-- ADMIN NAVIGATION -->
  <!-- ================================= -->

  @if (role === 'ADMIN') {

    <ion-tab-bar
      slot="bottom"
      class="bottom-navigation admin-navigation">

      @for (tab of adminTabs; track tab.route) {

        <ion-tab-button
          [tab]="tab.route">

          <ion-icon
            [name]="tab.icon">
          </ion-icon>

          <ion-label>
            {{ tab.label }}
          </ion-label>

        </ion-tab-button>

      }

    </ion-tab-bar>

  }

</ion-tabs>
