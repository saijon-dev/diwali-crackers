@if (cartCount > 0) {

  <!-- =================================================
       FLOATING CART
  ================================================= -->

  <ion-button
    type="button"
    fill="clear"
    aria-label="Open cart"

    (pointerdown)="startDrag($event)"
    (pointermove)="drag($event)"
    (pointerup)="endDrag($event)"
    (pointercancel)="endDrag($event)"

    (click)="openCart()"

    class="!fixed !z-[9999] !m-0 !h-[54px] !w-[54px] !min-h-0 !min-w-0 !rounded-full !border !border-[#eadfcb] !bg-[#fffdf7] !p-0 !text-[#8f071f] !shadow-[0_4px_16px_rgba(80,20,20,0.18)]"

    [style.right.px]="right"
    [style.bottom.px]="bottom"

    style="
      --background: #fffdf7;
      --background-hover: #fffdf7;
      --background-activated: #f7ead0;
      --color: #8f071f;
      --border-radius: 9999px;
      --border-width: 1px;
      --border-color: #eadfcb;
      --padding-start: 0;
      --padding-end: 0;
      --padding-top: 0;
      --padding-bottom: 0;
      --box-shadow: 0 4px 16px rgba(80,20,20,0.18);
      touch-action: none;
    "
  >

    <ion-icon
      slot="icon-only"
      name="cart-outline"
      class="!text-[25px] !text-[#8f071f]"
    ></ion-icon>

  </ion-button>


  <!-- =================================================
       CART BADGE
       MOVES WITH THE CART
  ================================================= -->

  <ion-badge
    class="!pointer-events-none !fixed !z-[10000] !flex !h-[19px] !min-w-[19px] !items-center !justify-center !rounded-full !border-2 !border-white !bg-[#8f071f] !px-1 !font-sans !text-[8px] !font-extrabold !leading-none !text-[#fff8dc] !shadow-[0_2px_6px_rgba(80,0,15,0.20)]"

    [style.right.px]="right - 5"
    [style.bottom.px]="bottom + 45"
  >
    {{ cartCount }}
  </ion-badge>

}
